name: Release

# Se dispara al pushear un tag "v*" (ej. v0.2.0). BACKEND_URL se toma de un
# secret del repo (Settings > Secrets and variables > Actions) y se escribe
# a src/core/.env antes de cada build — core/config.py lo carga con
# python-dotenv apuntando a esa ruta explícita (ver comentario en ese
# archivo sobre por qué no se usa load_dotenv() a secas).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-linux-web-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [linux, web, apk]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"

      # Flutter necesita GTK3 para compilar el target de escritorio Linux, y
      # el plugin flutter_secure_storage (usado por SecureStorage acá) pide
      # libsecret (keyring de GNOME) en su versión Linux — ninguno de los
      # dos viene preinstalado en el runner.
      - name: Instalar dependencias de Flutter para Linux desktop
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"

      - run: uv sync

      # flet build solo empaqueta lo que está bajo src/ (tool.flet.app.path),
      # así que el .env tiene que vivir ahí para viajar dentro del ejecutable
      # final — un .env en la raíz del repo nunca llega al build empaquetado.
      - name: Escribir .env con el backend de producción
        run: echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > src/core/.env

      - run: uv run flet build ${{ matrix.target }} --yes

      # flet build linux deja un ejecutable "portable" (carpeta con binario +
      # libs), no un instalador. Lo envolvemos en un AppImage, que corre en
      # cualquier distro sin instalación previa de dependencias.
      # --appimage-extract-and-run evita depender de libfuse2, que los
      # runners de GitHub no traen instalado.
      - name: Empaquetar linux como AppImage
        if: matrix.target == 'linux'
        run: |
          set -e
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR"
          cp -r build/linux/* "$APPDIR/"

          BIN="$(find "$APPDIR" -maxdepth 1 -type f -executable -printf '%f\n' | head -n1)"

          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          export LD_LIBRARY_PATH="\$HERE/lib:\$LD_LIBRARY_PATH"
          exec "\$HERE/$BIN" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cp src/assets/icon.png "$APPDIR/fractall.png"
          cat > "$APPDIR/fractall.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Fractall
          Exec=$BIN
          Icon=fractall
          Categories=Office;
          EOF

          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" build/linux/Fractall-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: fractall-${{ matrix.target }}
          path: build/${{ matrix.target }}

  build-windows:
    needs: build-linux-web-android
    runs-on: windows-latest
    env:
      # Sin esto, la consola de Windows usa cp1252 por defecto y flet build
      # (que imprime emojis de progreso vía `rich`) revienta con
      # UnicodeEncodeError al intentar mostrar el primer ✅.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"

      - run: uv sync

      # flet build solo empaqueta lo que está bajo src/ (tool.flet.app.path),
      # así que el .env tiene que vivir ahí para viajar dentro del ejecutable
      # final — un .env en la raíz del repo nunca llega al build empaquetado.
      - name: Escribir .env con el backend de producción
        run: echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > src/core/.env

      - run: uv run flet build windows --yes

      - uses: actions/upload-artifact@v7
        with:
          name: fractall-windows
          path: build/windows

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"

      - run: uv sync

      # flet build solo empaqueta lo que está bajo src/ (tool.flet.app.path),
      # así que el .env tiene que vivir ahí para viajar dentro del ejecutable
      # final — un .env en la raíz del repo nunca llega al build empaquetado.
      - name: Escribir .env con el backend de producción
        run: echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" > src/core/.env

      - run: uv run flet build macos --yes

      - uses: actions/upload-artifact@v7
        with:
          name: fractall-macos
          path: build/macos

  release:
    needs: [build-linux-web-android, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Comprimir cada build
        run: |
          cd artifacts
          for dir in */; do
            nombre="${dir%/}"
            zip -r "../${nombre}.zip" "$nombre"
          done

      - name: Crear GitHub Release con todos los paquetes adjuntos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ./*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
