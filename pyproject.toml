[project]
name = "fractall-flet"
version = "0.1.0"
description = "Cliente multiplataforma (movil/desktop) para el sistema de facturacion electronica FRACTALL"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fractall", email = "manusl2908@gmail.com" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-secure-storage>=0.86.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "app.fractall"
product = "Fractall"
company = "Fractall"
copyright = "Copyright (C) 2026 by Fractall"

[tool.flet.app]
path = "src"

[tool.flet.android]
# 24 (Android 7.0) es el piso real para esta app: Flutter 3.44.8 exige 23
# como mínimo absoluto, pero el manifest merge de Gradle además rechaza
# cualquier valor menor a 24 porque una dependencia transitiva
# (flutter_plugin_android_lifecycle) declara minSdkVersion=24. Ambos
# límites confirmados por el propio build. Fijado explícito para no
# depender del default implícito de Flutter.
min_sdk_version = 24
